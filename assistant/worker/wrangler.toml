name = "sereinora-assistant"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Content of conversations is never logged; only error status codes are.
[observability]
enabled = false

[vars]
ALLOWED_ORIGINS = "https://sereinora.com,https://www.sereinora.com,https://sereinora-com.translate.goog"
MODEL = "claude-opus-5-5"
EFFORT = "low"

# Secret, set once with:  npx wrangler secret put ANTHROPIC_API_KEY
